<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; }
        body { background: #eef4f7; }
    </style>
    <script>
        function notifyError(message) {
            if (window.AndroidBridge) {
                AndroidBridge.onMapError(String(message));
            }
        }

        window.onerror = function (message, source, lineno, colno, error) {
            notifyError(message + ' (' + lineno + ':' + colno + ')');
        };
    </script>
</head>
<body>
<div id="map"></div>
<script>
    var map = null;
    var markerItems = [];

    function getAppKey() {
        return new URLSearchParams(window.location.search).get('appkey') || '';
    }

    function loadKakaoScript() {
        var appKey = getAppKey();
        if (!appKey) {
            notifyError('JavaScript 앱 키가 비어 있습니다.');
            return;
        }
        var script = document.createElement('script');
        script.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + encodeURIComponent(appKey) + '&autoload=false';
        script.onerror = function () {
            notifyError('카카오맵 JavaScript SDK를 불러오지 못했습니다. 인터넷 연결, JavaScript 키, Web 도메인(https://appassets.androidplatform.net)을 확인하세요.');
        };
        script.onload = initMap;
        document.head.appendChild(script);
    }

    function initMap() {
        try {
            if (!window.kakao || !kakao.maps) {
                notifyError('카카오맵 객체가 없습니다. 콘솔 Web 도메인에 https://appassets.androidplatform.net 등록 여부를 확인하세요.');
                return;
            }
            kakao.maps.load(function () {
                var container = document.getElementById('map');
                map = new kakao.maps.Map(container, {
                    center: new kakao.maps.LatLng(36.5, 127.5),
                    level: 7
                });
                if (window.AndroidBridge) {
                    AndroidBridge.onMapReady();
                }
            });
        } catch (e) {
            notifyError(e.message || e);
        }
    }

    function clearMarkers() {
        markerItems.forEach(function (item) {
            item.marker.setMap(null);
        });
        markerItems = [];
    }

    function setMarkers(json) {
        if (!map) return 0;
        clearMarkers();
        var travels = Array.isArray(json) ? json : JSON.parse(json);
        var bounds = new kakao.maps.LatLngBounds();
        travels.forEach(function (t) {
            var pos = new kakao.maps.LatLng(t.lat, t.lng);
            var marker = new kakao.maps.Marker({ position: pos, title: t.place });
            marker.setMap(map);
            kakao.maps.event.addListener(marker, 'click', function () {
                if (window.AndroidBridge) {
                    AndroidBridge.onMarkerClick(t.id);
                }
            });
            markerItems.push({ marker: marker, lat: t.lat, lng: t.lng });
            bounds.extend(pos);
        });
        if (travels.length === 1) {
            map.setCenter(bounds.getSouthWest());
            map.setLevel(12);
        } else if (travels.length > 1) {
            map.setBounds(bounds);
        } else {
            map.setCenter(new kakao.maps.LatLng(36.5, 127.5));
            map.setLevel(7);
        }
        return travels.length;
    }

    function setMapType(type) {
        if (!map) return;
        if (type === 'satellite') {
            map.setMapTypeId(kakao.maps.MapTypeId.HYBRID);
        } else {
            map.setMapTypeId(kakao.maps.MapTypeId.ROADMAP);
        }
    }

    function fitMarkers() {
        if (!map || markerItems.length === 0) return 0;
        var bounds = new kakao.maps.LatLngBounds();
        markerItems.forEach(function (item) {
            bounds.extend(new kakao.maps.LatLng(item.lat, item.lng));
        });
        if (markerItems.length === 1) {
            map.setCenter(bounds.getSouthWest());
            map.setLevel(12);
        } else {
            map.setBounds(bounds);
        }
        return markerItems.length;
    }

    loadKakaoScript();
</script>
</body>
</html>
